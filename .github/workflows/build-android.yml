name: Build Android GDExtension

on: [push, pull_request]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Ensure godot-cpp is present
        run: |
          if [ ! -f "godot-cpp/SConstruct" ]; then
            echo "godot-cpp SConstruct is missing! Cloning fresh copy..."
            rm -rf godot-cpp
            git clone --depth 1 https://github.com/godotengine/godot-cpp.git godot-cpp
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SCons
        run: python -m pip install scons

      # تثبيت NDK r28b وربطه تلقائياً بمسار الـ SDK
      - name: Setup Android NDK (r28b)
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28b
          link-to-sdk: true

      # تصدير المسار ليتعرف عليه SCons فوراً
      - name: Export NDK Path
        run: |
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      # كاش لتسريع البناء اللاحق
      - name: Cache godot-cpp and SCons
        uses: actions/cache@v4
        with:
          path: |
            godot-cpp/bin
            godot-cpp/gen
            .scons-cache
          key: godot-cpp-r28b-arm64-v1
          restore-keys: |
            godot-cpp-r28b-arm64-

      # أمر البناء النظيف
      - name: Build GridMap2 (Debug ARM64)
        run: |
          scons platform=android target=template_debug arch=arm64 -j$(nproc)

      - name: Upload .so Only
        uses: actions/upload-artifact@v4
        with:
          name: libgridmap2-android-arm64
          path: project/bin/*.so
          if-no-files-found: error
