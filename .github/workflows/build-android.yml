name: Build Android GDExtension

on: [push, pull_request]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SCons
        run: python -m pip install scons

      # استخدام NDK حديث جداً (r27c) متوافق مع أحدث معالجات أندرويد
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      # هذا هو السحر: حفظ ملفات بناء godot-cpp لتُطبخ مرة واحدة فقط
      - name: Cache godot-cpp and SCons
        uses: actions/cache@v4
        with:
          path: |
            godot-cpp/bin
            godot-cpp/gen
            .scons-cache
          key: godot-cpp-android-r27c-${{ hashFiles('godot-cpp/**') }}
          restore-keys: |
            godot-cpp-android-r27c-

      - name: Build GridMap2 (Debug ARM64)
        run: |
          scons platform=android target=template_debug arch=arm64 scons_cache=.scons-cache -j$(nproc)

      # رفع ملف الـ .so فقط كـ Artifact
      - name: Upload .so Only
        uses: actions/upload-artifact@v4
        with:
          name: libgridmap2-android-arm64
          path: project/bin/*.so
          if-no-files-found: error
