name: Build Android GDExtension

on: [push, pull_request]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # الحل السحري: تحميل godot-cpp تلقائياً بالسيرفر إذا كان المجلد فارغاً بهاتفك
      - name: Ensure godot-cpp is present
        run: |
          if [ ! -f "godot-cpp/SConstruct" ]; then
            echo "godot-cpp SConstruct is missing! Cloning fresh copy..."
            rm -rf godot-cpp
            git clone --depth 1 https://github.com/godotengine/godot-cpp.git godot-cpp
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SCons
        run: python -m pip install scons

      # استخدام NDK r28b الرسمي المطلوب لجودوت الحديث
      - name: Setup Android NDK (r28b)
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28b
          add-to-path: true

      # مفتاح كاش ثابت حتى لا يعيد بناء godot-cpp نهائياً بعد أول نجاح
      - name: Cache godot-cpp and SCons
        uses: actions/cache@v4
        with:
          path: |
            godot-cpp/bin
            godot-cpp/gen
            .scons-cache
          key: godot-cpp-r28b-arm64-v1
          restore-keys: |
            godot-cpp-r28b-arm64-

      - name: Build GridMap2 (Debug ARM64)
        run: |
          scons platform=android target=template_debug arch=arm64 scons_cache=.scons-cache -j$(nproc)

      - name: Upload .so Only
        uses: actions/upload-artifact@v4
        with:
          name: libgridmap2-android-arm64
          path: project/bin/*.so
          if-no-files-found: error
